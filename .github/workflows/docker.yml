# Verification variant: renders the release-wave candidate stack via the
# repo bundle (the stock container image does not carry metanorma-un).
name: docker

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Print Metanorma version
        run: bundle exec metanorma --version

      - name: Cache or generate Metanorma XML
        uses: actions-mn/build-and-publish@v2
        with:
          use-bundler: true
          agree-to-terms: true
          destination: artifact
          artifact-name: mn
          cache-site-for-manifest: metanorma.yml
